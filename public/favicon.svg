<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <title>SynCatch</title>
  <!-- A loop dissolving into dots just before closing. Ink in light tabs, white in dark tabs. -->
  <style>
    .mark { stroke: #222326; }
    .dot { fill: #222326; }
    @media (prefers-color-scheme: dark) {
      .mark { stroke: #F4F5F8; }
      .dot { fill: #F4F5F8; }
    }
  </style>
  <path class="mark" d="M 15.2 62.7 A 37 37 0 1 1 71.3 80.3" stroke-width="16" stroke-linecap="round"/>
  <circle class="dot" cx="50" cy="87" r="7"/>
  <circle class="dot" cx="28.8" cy="80.3" r="4.5"/>
</svg>
